# Netlify deployment config.
#
# Netlify detects the Next.js runtime (OpenNext adapter) automatically and
# installs @netlify/plugin-nextjs unpinned, so it keeps receiving upstream
# fixes. The block below only makes that explicit — do NOT add a version
# here, pinning opts out of automatic adapter updates.

[build]
  # Turbopack (the default). The build must stay Turbopack-compatible
  # because the middleware runs on the EDGE runtime (see middleware.ts):
  # the adapter bundles edge assets for Turbopack builds.
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 requires Node >= 20.9.
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ---------------------------------------------------------------------------
# Auth-dependent routes must never be cached at the CDN.
#
# Every page below reads the signed-in user's data with `cookies()`, so its
# response is only valid for the request that produced it. Netlify's Durable
# Cache keys on URL + a fixed vary list that does not include the InsForge
# auth cookies, so without these rules a response rendered for one session
# (or an anonymous prerender/redirect) can be replayed to everyone else —
# the layout shell arrives but the per-user page content does not, which
# reads as a blank content area behind the sidebar.
#
# `Netlify-CDN-Cache-Control` is the directive Netlify's CDN honors; the
# plain `Cache-Control` keeps intermediate proxies honest too.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/home"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "no-store"

[[headers]]
  for = "/habits"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "no-store"

